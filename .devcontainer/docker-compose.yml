services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:20
    command: sleep infinity
    volumes:
      - ..:/workspaces/IHMS-OHE:cached
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ohe
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ohe
      COOKIE_SECURE: "false"
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ohe
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
